<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Check-in Giải Bóng Đá</title>
  <!-- Thư viện tạo mã QR tự động -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
    
    .nav-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .nav-tabs button { padding: 10px 20px; font-weight: bold; border: none; background: #e4e6eb; border-radius: 8px; cursor: pointer; font-size: 15px; }
    .nav-tabs button.active { background: #1C4A34; color: white; }
    
    .tab-content { display: none; max-width: 700px; margin: auto; }
    .tab-content.active { display: block; }
    
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
    
    .qr-container { background: #f8f9fa; border: 2px dashed #1C4A34; border-radius: 12px; padding: 20px; display: inline-block; margin: 15px 0; }
    #qrcode img { margin: auto; border: 4px solid white; border-radius: 8px; }
    
    input { width: 80%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
    .btn-main { width: 85%; padding: 12px; background: #1C4A34; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    
    .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; text-align: left; display: none; }
    .player { background: #e8f5e9; border: 1px solid #4caf50; }
    .btc { background: #fff8e1; border: 1px solid #ffb300; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #1C4A34; color: white; }
    .stat-box { display: flex; gap: 15px; margin-bottom: 15px; }
    .stat-card { flex: 1; background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  </style>
</head>
<body>

<div class="nav-tabs">
  <button id="tab1-btn" class="active" onclick="switchTab('checkin-tab')">QUẤY CHECK-IN SÂN BÓNG</button>
  <button id="tab2-btn" onclick="switchTab('dashboard-tab'); loadDashboard();">DANH SÁCH & THỐNG KÊ CHI TIẾT</button>
</div>

<!-- TAB 1: QUẦY CHECK-IN -->
<div id="checkin-tab" class="tab-content active">
  <div class="card">
    <h2 style="color: #1C4A34; margin: 0;">CHECK-IN GIẢI BÓNG ĐÁ</h2>
    
    <!-- KHỐI HIỂN THỊ MÃ QR ĐỂ QUÉT -->
    <div class="qr-container">
      <h3 style="margin: 0 0 10px 0; color: #333;">QUÉT MÃ QR ĐỂ ĐIỂM DANH</h3>
      <div id="qrcode"></div>
      <p style="font-size: 13px; color: #666; margin: 10px 0 0 0;">Dùng Camera / Zalo quét mã để mở trang xác thực</p>
    </div>

    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

    <!-- KHỐI NHẬP TAY SĐT / MSNV -->
    <p style="margin: 5px 0; font-weight: bold; color: #555;">Hoặc HDV nhập SĐT / MSNV trực tiếp:</p>
    <input type="text" id="userInput" placeholder="Nhập SĐT hoặc MSNV...">
    <br>
    <button class="btn-main" onclick="submitCheckIn()">XÁC NHẬN CHECK-IN</button>

    <!-- KẾT QUẢ HIỂN THỊ -->
    <div id="resultBox" class="result-box"></div>
  </div>
</div>

<!-- TAB 2: QUẢN LÝ DANH SÁCH CHI TIẾT -->
<div id="dashboard-tab" class="tab-content">
  <div class="stat-box">
    <div class="stat-card"><h2 id="countChecked" style="color: green; margin:0;">0</h2><p style="margin:5px 0 0 0;">Đã Check-in</p></div>
    <div class="stat-card"><h2 id="countNotChecked" style="color: red; margin:0;">0</h2><p style="margin:5px 0 0 0;">Chưa Check-in</p></div>
  </div>

  <div class="card" style="text-align: left; margin-bottom: 20px;">
    <h3 style="color: #c62828;">Danh Sách CHƯA Check-in (Chi Tiết)</h3>
    <div style="overflow-x:auto;">
      <table id="notCheckedTable">
        <thead>
          <tr><th>Họ Tên</th><th>MSNV/SĐT</th><th>Đội</th><th>Zone</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="card" style="text-align: left;">
    <h3 style="color: #2e7d32;">Danh Sách ĐÃ Check-in (Chi Tiết)</h3>
    <div style="overflow-x:auto;">
      <table id="checkedTable">
        <thead>
          <tr><th>Họ Tên</th><th>MSNV/SĐT</th><th>Đội</th><th>Zone</th><th>Số Áo</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "DÁN_LINK_WEB_APP_URL_TỪ_APPSCRIPT_VÀO_ĐÂY";

  // Tự động vẽ hình ảnh mã QR dựa vào URL trang hiện tại
  window.onload = function() {
    new QRCode(document.getElementById("qrcode"), {
      text: window.location.href,
      width: 180,
      height: 180
    });
  };

  function submitCheckIn() {
    const val = document.getElementById('userInput').value.trim();
    if (!val) return alert("Vui lòng nhập MSNV hoặc SĐT!");

    const resBox = document.getElementById('resultBox');
    resBox.style.display = 'block';
    resBox.className = 'result-box';
    resBox.innerHTML = 'Đang tra cứu dữ liệu...';

    fetch(`${SCRIPT_URL}?query=${encodeURIComponent(val)}`)
      .then(res => res.json())
      .then(data => {
        if (!data.success) {
          resBox.style.backgroundColor = '#ffebee';
          resBox.innerHTML = `<b style="color:red;">❌ ${data.message}</b>`;
          return;
        }
        
        const d = data.data;
        if (d.isBTC) {
          resBox.className = 'result-box btc';
          resBox.innerHTML = `
            <h3 style="color:#d97706; margin:0 0 10px 0;">BAN TỔ CHỨC / TRỌNG TÀI</h3>
            <p><b>Họ tên:</b> ${d.hoTen}</p>
            <p><b>Zone:</b> ${d.zone}</p>
            <p style="color:green; font-weight:bold; margin-bottom:0;">✓ CHECK-IN THÀNH CÔNG!</p>`;
        } else {
          resBox.className = 'result-box player';
          resBox.innerHTML = `
            <h3 style="color:#15803d; margin:0 0 10px 0;">CẦU THỦ THI ĐẤU</h3>
            <p><b>Họ tên:</b> ${d.hoTen}</p>
            <p><b>Đội bóng:</b> ${d.tenDoi || 'Chưa cập nhật'}</p>
            <p><b>Số áo:</b> ${d.soAo || 'N/A'} | <b>Zone:</b> ${d.zone}</p>
            <p style="color:green; font-weight:bold; margin-bottom:0;">✓ CHECK-IN THÀNH CÔNG!</p>`;
        }
        document.getElementById('userInput').value = '';
      })
      .catch(err => {
        resBox.innerHTML = `<b style="color:red;">Lỗi kết nối Server! Kiểm tra lại SCRIPT_URL.</b>`;
      });
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if (tabId === 'checkin-tab') document.getElementById('tab1-btn').classList.add('active');
    else document.getElementById('tab2-btn').classList.add('active');
  }

  function loadDashboard() {
    fetch(`${SCRIPT_URL}?action=getDashboard`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('countChecked').innerText = data.checkedIn.length;
        document.getElementById('countNotChecked').innerText = data.notCheckedIn.length;

        const notCheckTbody = document.querySelector('#notCheckedTable tbody');
        notCheckTbody.innerHTML = data.notCheckedIn.map(i => 
          `<tr><td>${i.hoTen}</td><td>${i.msnv || i.sdt}</td><td>${i.tenDoi || '-'}</td><td>${i.zone}</td></tr>`
        ).join('');

        const checkTbody = document.querySelector('#checkedTable tbody');
        checkTbody.innerHTML = data.checkedIn.map(i => 
          `<tr><td>${i.hoTen}</td><td>${i.msnv || i.sdt}</td><td>${i.tenDoi || '-'}</td><td>${i.zone}</td><td>${i.soAo || '-'}</td></tr>`
        ).join('');
      });
  }
</script>
</body>
</html>
